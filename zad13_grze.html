<!DOCTYPE html>

    <title>Zadanie 13 - Grzegorzak</title>
</head>
<body>
<div style="color:red;font-size:50px;">
<script language="JavaScript">
    var liczba1=prompt("daj mianownik m=","");
    var m_grz=parseFloat(liczba1);

    document.write("m="+m_grz+"<br>");

    m1=m_grz+1;
    m2=(m_grz+1)*m_grz;

    document.write("1/"+m_grz+"=1/"+m1+"+1/"+m2+"<br>");
</script>
</div>

<input type="button" value="zamknij okno" onclick="window.close()" />

</body>
