<!DOCTYPE html>
<head>
<title>proste obliczenia</title>
<meta charset="utf-8">
</head>
<body>
<div style="color:red;font-size:50px;">
<script language="javascript">
var liczba1=prompt("daj mianownik","m");
var m_grz=parseFloat(liczba1);

document.write("m="+m_grz+"<br>");
m1=m_grz+1;
m2=(m_grz+2)*m_grz;
m3=(m_grz+1)*m_grz;
document.write("1/"+m_grz+"=1/"+m1+"+1/"+m2+"+1/"+m3+"<br>");
</script>
</div>
</body>
