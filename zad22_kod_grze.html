<!DOCTYPE html>

<body>

<h2>Obliczanie pola i obwodu prostokąta</h2>

Podaj bok a: <input type="number" id="a_dana_grz"><br><br>
Podaj bok b: <input type="number" id="b_dana_grz"><br><br>

<button onclick="oblicz_grz()">Oblicz</button>

<br><br>


    
        Pole
       <input type="text" id="wyprowadz_pole_grz">
   <br><br> 
        Obwód
        <input type="text" id="wyprowadz_obwod_grz">
    


<script>

function Pole_grz(a_grz,b_grz)
{
    return a_grz * b_grz;
}

function obwod_grz(a_grz,b_grz)
{
    return 2 * a_grz + 2 * b_grz;
}

function oblicz_grz()
{
    var a_grz = parseFloat(document.getElementById("a_dana_grz").value);
    var b_grz = parseFloat(document.getElementById("b_dana_grz").value);

    document.getElementById("wyprowadz_pole_grz").value = Pole_grz(a_grz,b_grz);
    document.getElementById("wyprowadz_obwod_grz").value = obwod_grz(a_grz,b_grz);
}

</script>

</body>
</html>
